<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Europa 2026">
<title>Europa 2026</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
/* ============================================================
   EUROPA 2026 — app del viaje
   Satoshi · hueso · Klein en escala · mobile-first
   ============================================================ */
:root{
  --bg:#F3F1EC; --surface:#F8F7F4; --card:#EAE7E0; --line:#D8D4CC;
  --title:#121212; --text:#3A3A38; --sec:#696966; --note:#A4A29C;
  --k100:#002FA7; --k70:#4969BC; --k40:#92A3D0; --k20:#C2CADE; --k10:#DBDEE5;
  --s100:#A8462F; --s70:#C4715A; --s40:#DFA894; --s20:#EFD3C8; --s10:#F8E9E3;
  --ok:#4F6B4A; --warn:#B48A2E; --err:#8C3B2A;
  --nav-h:64px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:'Satoshi',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  font-size:15px;font-weight:500;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + var(--sab) + 24px);
}
.caps{font-weight:500;font-size:12.5px;font-variant-caps:all-small-caps;letter-spacing:.04em;line-height:1.4}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hide{display:none !important}

/* ---------- LAYOUT ---------- */
.app{max-width:720px;margin:0 auto;padding:0 18px}
@media (min-width:1100px){ .app{max-width:1180px;padding:0 40px} }

/* ---------- PORTADA ---------- */
.hero{position:relative;height:min(48vh,400px);min-height:300px;overflow:hidden;background:var(--card)}
@media (min-width:1100px){ .hero{height:360px;min-height:0} }
.hero .slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease}
.hero .slide.on{opacity:1}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(18,18,18,.05) 0%,rgba(18,18,18,.08) 45%,rgba(18,18,18,.72) 100%)}
.hero .txt{position:absolute;left:0;right:0;bottom:0;padding:0 18px 26px;color:#F3F1EC;z-index:1;max-width:720px;margin:0 auto}
@media (min-width:1100px){ .hero .txt{max-width:1180px;padding:0 40px 40px} }
.hero .eyebrow{font-size:12.5px;font-variant-caps:all-small-caps;letter-spacing:.05em;opacity:.85;margin-bottom:8px}
.hero h1{font-weight:700;font-size:clamp(40px,10vw,76px);line-height:.95;letter-spacing:-.03em;color:#F3F1EC}
.hero .dates{margin-top:12px;font-size:15px;opacity:.9}
.hero .tag{position:absolute;top:calc(var(--sat) + 16px);right:18px;z-index:2;color:#F3F1EC;
  font-weight:700;font-size:12.5px;font-variant-caps:all-small-caps;letter-spacing:.08em;
  padding:6px 11px;border:1px solid rgba(243,241,236,.55);border-radius:2px;background:rgba(18,18,18,.28);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .5s}
.hero .dots{position:absolute;right:18px;bottom:26px;display:flex;gap:6px;z-index:1}
.hero .dots i{width:5px;height:5px;border-radius:50%;background:#F3F1EC;opacity:.4}
.hero .dots i.on{opacity:1}

.counter{display:flex;gap:0;margin:18px 0 0;border-bottom:1px solid var(--line)}
.counter div{flex:1;padding:14px 0 16px}
.counter .n{display:block;font-weight:700;font-size:26px;line-height:1;letter-spacing:-.02em;color:var(--title)}
.counter .l{display:block;color:var(--sec);margin-top:6px}
.counter .hero-n .n{color:var(--k100)}

/* ---------- AVISOS ---------- */
.alerts{margin:18px 0 0;display:flex;flex-direction:column}
.alert{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.alert:last-child{border-bottom:0}
.alert b{color:var(--title);font-weight:700}
.alert .dot{width:6px;height:6px;border-radius:50%;margin-top:8px;flex:0 0 auto;background:var(--warn)}
.alert.err .dot{background:var(--err)} .alert.ok .dot{background:var(--ok)}

/* ---------- SECCIONES ---------- */
.view{display:none}
.view.on{display:block}
h2.sec{font-weight:700;font-size:22px;letter-spacing:-.025em;color:var(--title);margin:34px 0 14px}

/* ---------- MAPA ---------- */
#map{height:min(56vh,440px);min-height:300px;border:1px solid var(--line);background:var(--card);z-index:0}
@media (min-width:1100px){ #map{height:520px} }
.leaflet-container{font-family:inherit;background:var(--card)}
.leaflet-tile-pane{filter:grayscale(1) contrast(1.02) brightness(1.04);opacity:.92}
.leaflet-control-attribution{font-size:9px;background:rgba(243,241,236,.85);color:var(--note)}
.leaflet-control-attribution a{color:var(--sec)}
.leaflet-control-zoom a{color:var(--title);background:var(--surface);border-color:var(--line) !important}
.leaflet-tooltip{font-family:inherit;font-weight:700;font-size:13px;letter-spacing:-.01em;color:var(--title);background:var(--surface);border:1px solid var(--line);border-radius:2px;box-shadow:none;padding:4px 9px}
.leaflet-tooltip::before{display:none}
.num-pin{width:22px;height:22px;border-radius:50%;background:var(--k100);color:#F3F1EC;border:2px solid #F3F1EC;
  font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;letter-spacing:-.02em;box-shadow:0 0 0 1px var(--k40)}
.num-pin.wide{width:auto;min-width:22px;padding:0 6px;border-radius:11px;white-space:nowrap}
.leaflet-tooltip.lbl{padding:3px 8px;font-size:12px}
.leaflet-popup-content-wrapper{border-radius:2px;box-shadow:none;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px}
.leaflet-popup-content{margin:12px 14px;line-height:1.45}
.leaflet-popup-content b{color:var(--title)}
.leaflet-popup-tip{box-shadow:none;border:1px solid var(--line)}
.map-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;color:var(--sec)}
.map-legend span{display:inline-flex;align-items:center;gap:7px}
.map-legend i{display:inline-block;width:22px;border-top:2px solid var(--k70)}
.map-legend i.dash{border-top-style:dashed}
.map-legend i.dot{width:8px;height:8px;border:0;border-radius:50%;background:var(--k100)}
.map-legend i.poi{width:8px;height:8px;border:0;border-radius:50%;background:#121212}
.poi-lbl{background:#F8F7F4;border:1px solid var(--line);box-shadow:none;color:var(--title);
  font-family:inherit;font-weight:700;font-size:11.5px;letter-spacing:-.01em;padding:2px 6px;border-radius:2px;opacity:1}
.poi-lbl::before{display:none}

/* ---------- AGENDA ---------- */
.city{margin-top:26px}
.city:first-child{margin-top:18px}
.banner{position:relative;height:168px;display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:1fr 1fr;gap:2px;overflow:hidden;background:var(--card)}
.banner.one{grid-template-columns:1fr}
.banner.two{grid-template-rows:1fr}
.banner .ph{background-size:cover;background-position:center}
.banner .ph:first-child{grid-row:1 / -1}
.banner.two .ph:first-child{grid-row:auto}
.banner::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(18,18,18,.78) 0%,rgba(18,18,18,.25) 48%,rgba(18,18,18,0) 100%);pointer-events:none}
.banner .cap{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;color:#F3F1EC;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.banner .cap h3{font-weight:700;font-size:28px;letter-spacing:-.03em;line-height:1}
.banner .cap .sub{font-size:12.5px;font-variant-caps:all-small-caps;letter-spacing:.05em;opacity:.85;margin-top:4px}
.banner .cap .n{font-weight:700;font-size:13px;font-variant-caps:all-small-caps;letter-spacing:.05em;white-space:nowrap;opacity:.9}
@media (min-width:1100px){ .banner{height:220px} .banner .cap h3{font-size:34px} }

.day{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:14px 0 4px;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day .dn{position:sticky;top:calc(var(--sat) + 8px);align-self:start}
.day .dn .d{display:block;font-weight:700;font-size:26px;letter-spacing:-.03em;line-height:1;color:var(--title)}
.day .dn .w{display:block;color:var(--note);margin-top:3px;font-size:12px;font-variant-caps:all-small-caps;letter-spacing:.04em}
.day .dn .c{display:block;color:var(--sec);margin-top:8px;font-size:12px;font-variant-caps:all-small-caps;letter-spacing:.04em;line-height:1.2}
.day .list{display:flex;flex-direction:column;gap:6px;min-width:0}
.day .add{align-self:flex-start;color:var(--note);font-size:12.5px;font-variant-caps:all-small-caps;letter-spacing:.04em;padding:6px 0 4px}
.day .add:hover,.day .add:active{color:var(--k100)}
.day.empty .list{opacity:.8}

/* fichas */
.chip{
  width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;
  padding:11px 12px;border-radius:2px;border:1px solid var(--line);background:var(--surface);
  font-size:15px;line-height:1.38;color:var(--sec);
}
.chip .tx{flex:1;min-width:0}
.chip .tx b{display:block;font-weight:700;color:var(--title);letter-spacing:-.01em}
.chip .tx span{display:block;color:var(--sec);font-size:12.5px;font-variant-caps:all-small-caps;letter-spacing:.04em;margin-top:3px}
.chip .tx small{display:block;font-size:13.5px;color:var(--sec);margin-top:5px;line-height:1.4;font-variant-caps:normal;letter-spacing:0}
.chip.traslado{background:var(--k10);border-color:var(--k40)}
.chip.vuelo{background:var(--k10);border-color:var(--k70)}
.chip.vuelo .tx span{color:var(--k70)}
.chip.actividad{background:var(--s10);border-color:var(--s40)}
.chip.reservado{background:var(--s20);border-color:var(--s100);cursor:pointer}
.chip.reservado .tx span{color:var(--s70)}
.res{display:block;font-style:normal;font-weight:700;color:var(--s100);font-size:11.5px;
  font-variant-caps:all-small-caps;letter-spacing:.06em;margin-top:5px}
.cellbody .res{font-size:10.5px;margin-top:3px}
.chip.nota{background:transparent;border-style:dashed}
.chip.hito{background:var(--k10);border-color:var(--k70)}
.chip.locked{cursor:default}
.chip .mv{display:flex;flex-direction:column;gap:2px;flex:0 0 auto;margin:-6px -6px -6px 0}
.chip .mv button{width:30px;height:24px;color:var(--note);font-size:13px;line-height:1;border-radius:2px}
.chip .mv button:hover,.chip .mv button:active{color:var(--k100);background:var(--bg)}

.places{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.places h4{font-weight:500;font-size:12.5px;font-variant-caps:all-small-caps;letter-spacing:.04em;color:var(--s70);margin-bottom:12px}
.places ul{list-style:none;font-size:14.5px;line-height:1.45}
@media (min-width:760px){ .places ul{columns:2;column-gap:40px} }
.places li{padding:6px 0;color:var(--text);break-inside:avoid;display:flex;gap:9px}
.places li::before{content:'';flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:var(--s40);margin-top:8px}

/* ---------- FICHA DE ACTIVIDAD ---------- */
#sheet{max-width:720px;width:100%;max-height:92vh;padding:0;border:1px solid var(--line);border-radius:2px;background:var(--surface);overflow:hidden}
#sheet::backdrop{background:rgba(18,18,18,.45)}
#sheetBody{overflow-y:auto;max-height:92vh;-webkit-overflow-scrolling:touch}
.sheet-x{position:absolute;top:12px;right:12px;z-index:5;width:34px;height:34px;border-radius:50%;
  background:rgba(18,18,18,.5);color:#F3F1EC;font-size:14px;line-height:1;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sh-gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.sh-gal figure{flex:0 0 100%;scroll-snap-align:start;margin:0;position:relative}
.sh-gal img{width:100%;height:260px;object-fit:cover;display:block}
@media (min-width:760px){ .sh-gal img{height:330px} }
.sh-gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 12px;color:#F3F1EC;font-size:12.5px;
  background:linear-gradient(to top,rgba(18,18,18,.8),rgba(18,18,18,0))}
.sh-dots{display:flex;gap:6px;justify-content:center;padding:12px 0 0}
.sh-dots i{width:5px;height:5px;border-radius:50%;background:var(--note);opacity:.35}
.sh-dots i.on{opacity:1;background:var(--s100)}
.sh-in{padding:22px 26px 34px}
.sh-in h3{font-weight:700;font-size:23px;letter-spacing:-.025em;color:var(--title);line-height:1.15}
.sh-when{color:var(--s70);font-weight:700;font-size:12.5px;font-variant-caps:all-small-caps;letter-spacing:.05em;margin-top:8px}
.sh-code{display:inline-block;margin-top:12px;padding:5px 10px;border:1px solid var(--s100);border-radius:2px;
  color:var(--s100);font-weight:700;font-size:12px;font-variant-caps:all-small-caps;letter-spacing:.06em}
.sh-lead{margin-top:16px;font-size:16px;line-height:1.5;color:var(--title);font-weight:700;letter-spacing:-.01em}
.sh-in p.b{margin-top:13px;font-size:14.5px;line-height:1.6;color:var(--text)}
.sh-h{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);color:var(--s70);
  font-weight:500;font-size:12.5px;font-variant-caps:all-small-caps;letter-spacing:.04em}
.sh-spec{display:grid;grid-template-columns:1fr;gap:0;margin-top:6px}
.sh-spec div{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sh-spec div:last-child{border-bottom:0}
.sh-spec b{flex:0 0 34%;font-weight:500;color:var(--sec)}
.sh-list{margin-top:8px;font-size:14.5px;line-height:1.5}
.sh-list li{list-style:none;display:flex;gap:9px;padding:6px 0;color:var(--text)}
.sh-list li::before{content:'';flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:var(--s40);margin-top:8px}
.sh-list.warn li::before{background:var(--warn)}
.sh-list.tip li::before{background:var(--s100)}
.sh-list.tip li{color:var(--title)}
.sh-foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- CALENDARIO (desktop) ---------- */
.calwrap{overflow-x:auto;margin-top:14px}
table.cal{width:100%;min-width:1080px;border-collapse:collapse;table-layout:fixed}
table.cal th{color:var(--k70);text-align:left;padding:0 0 10px 2px;font-weight:500;font-size:12.5px;font-variant-caps:all-small-caps;letter-spacing:.04em}
table.cal td{vertical-align:top;border:1px solid var(--line);background:var(--surface);height:190px;padding:0;width:14.285%}
td.off{background:transparent;border-color:transparent}
.dnum{display:flex;align-items:baseline;gap:8px;padding:9px 10px 7px}
.dnum .d{font-weight:700;font-size:17px;letter-spacing:-.02em;color:var(--sec);line-height:1}
.dnum .wd{color:var(--note);font-size:12px;font-variant-caps:all-small-caps;letter-spacing:.04em}
td.key .dnum .d{color:var(--title)}
.dnum .add{margin-left:auto;opacity:0;color:var(--note);font-size:16px;line-height:1;padding:0 3px}
td:hover .add{opacity:1}
.cellbody{padding:0 8px 10px;display:flex;flex-direction:column;gap:4px}
.cellbody .chip{padding:7px 9px;font-size:13px}
.cellbody .chip .tx span{font-size:11.5px}
.cellbody .chip .mv{display:none}
.band{width:100%;display:flex;padding:7px 9px;border-radius:2px;text-align:left;background:var(--k20);color:var(--title);font-weight:700;font-size:13px;letter-spacing:-.01em}
.band.cont{font-weight:500;color:var(--sec);background:var(--k10)}
.band .lodge{display:block;font-weight:500;color:var(--sec);font-size:12px;margin-top:2px}
td.drop{background:var(--k10)} td.drop .dnum{box-shadow:inset 0 2px 0 var(--k70)}

/* mini calendario en celular */
.mini{display:none;gap:3px;flex-wrap:wrap;padding:1px 2px 0}
.mini i{width:5px;height:5px;border-radius:50%;background:var(--k70)}
.mini i.act{background:var(--s70)}
@media (max-width:1099px){
  table.cal{min-width:0}
  table.cal td{height:auto;min-height:74px}
  .dnum{flex-direction:column;align-items:flex-start;gap:1px;padding:6px 5px 3px}
  .dnum .d{font-size:14px}
  .dnum .wd,.dnum .add{display:none}
  .cellbody{padding:0 3px 7px;gap:3px}
  .cellbody .chip{display:none}
  .cellbody .band{padding:3px 4px;font-size:9.5px;letter-spacing:0}
  .cellbody .band span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;width:100%}
  .cellbody .band .lodge{display:none}
  .mini{display:flex}
  .calwrap{margin-left:-8px;margin-right:-8px}
}

/* ---------- RESUMEN ---------- */
.grid2{display:grid;grid-template-columns:1fr;gap:28px}
@media (min-width:760px){ .grid2{grid-template-columns:1fr 1fr;gap:48px} }
.card h3{font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--title);padding-bottom:12px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.row:last-child{border-bottom:0}
.row .k{flex:1;color:var(--text)} .row .k b{font-weight:700;color:var(--title)}
.row .v{color:var(--sec);white-space:nowrap;font-size:12.5px;font-variant-caps:all-small-caps;letter-spacing:.04em}
.mode{color:var(--k70);font-weight:700;font-size:12.5px;font-variant-caps:all-small-caps;letter-spacing:.04em;margin-right:6px}
.empty{color:var(--note);font-size:14px;padding:12px 0}

/* ---------- NAV INFERIOR ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(243,241,236,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--sab);
}
nav.tabs .in{max-width:720px;margin:0 auto;display:flex;height:var(--nav-h)}
@media (min-width:1100px){ nav.tabs .in{max-width:1180px} }
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--sec);font-size:11.5px;font-variant-caps:all-small-caps;letter-spacing:.05em;font-weight:500}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--k100);font-weight:700}


/* FAB */

/* ---------- DIÁLOGO (hoja inferior en móvil) ---------- */
dialog{
  border:1px solid var(--line);border-radius:2px;padding:0;max-width:540px;width:calc(100% - 32px);
  background:var(--surface);color:var(--text);max-height:calc(100vh - 40px);overflow:auto;
}
dialog::backdrop{background:rgba(18,18,18,.38)}
@media (max-width:640px){
  dialog{position:fixed;inset:auto 0 0 0;margin:0;width:100%;max-width:none;max-height:92vh;border-radius:14px 14px 0 0;border-bottom:0;padding-bottom:var(--sab)}
}
.dlg-h{padding:26px 22px 0;display:flex;align-items:center;justify-content:space-between}
.dlg-h h3{font-weight:700;font-size:22px;letter-spacing:-.025em;color:var(--title)}
.dlg-b{padding:20px 22px 0;display:flex;flex-direction:column;gap:18px}
.dlg-f{padding:22px 22px 24px;display:flex;gap:10px;align-items:center;margin-top:22px;border-top:1px solid var(--line)}
label{display:block;color:var(--k70);margin-bottom:7px;font-weight:500;font-size:12.5px;font-variant-caps:all-small-caps;letter-spacing:.04em}
input,select,textarea{
  width:100%;font-family:inherit;font-size:16px;font-weight:500;color:var(--title);background:var(--bg);
  border:1px solid var(--line);border-radius:2px;padding:11px 12px;-webkit-appearance:none;appearance:none;
}
select{background-image:linear-gradient(45deg,transparent 50%,var(--sec) 50%),linear-gradient(135deg,var(--sec) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}

/* ==================== ESTADO ==================== */
let state={items:[]};

function save(){ render(); }

/* ==================== FECHAS ==================== */
const d2s=d=>d.toISOString().slice(0,10);
const s2d=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));};
const addD=(s,n)=>{const d=s2d(s);d.setUTCDate(d.getUTCDate()+n);return d2s(d);};
const fmt=s=>{const d=s2d(s);return d.getUTCDate()+' '+MON[d.getUTCMonth()];};
const wd=s=>WD[s2d(s).getUTCDay()];
const between=(s,a,b)=>s>=a&&s<=b;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ==================== DERIVADOS ==================== */
const cityOn=date=>state.items.find(i=>i.type==='ciudad'&&i.date===date);
const ORD={ciudad:0,traslado:1,hito:1,actividad:2,nota:3};
function itemsOn(date){
  return [...FLIGHTS,...state.items].filter(i=>i.date===date).sort((a,b)=>{
    if(a.type==='ciudad'||b.type==='ciudad') return (ORD[a.type]??9)-(ORD[b.type]??9);
    const t=a.time||a.dep||'', u=b.time||b.dep||'';
    if(t&&u) return t.localeCompare(u);
    return (ORD[a.type]??9)-(ORD[b.type]??9);
  });
}
/* bloques consecutivos de la misma ciudad */
function blocks(){
  const out=[]; let d=ACTIVE_START;
  while(d<=ACTIVE_END){
    const c=cityOn(d); const name=c?c.city:null;
    const last=out[out.length-1];
    if(last && last.name===name) last.days.push(d); else out.push({name,days:[d],lodge:c?c.lodge:''});
    d=addD(d,1);
  }
  return out;
}

/* ==================== RENDER ==================== */
function render(){ renderCounter(); renderAlerts(); renderAgenda(); renderCal(); renderSummary(); renderMap(); refreshCityList(); }

function renderCounter(){
  let assigned=0,d=TRIP_START;
  while(d<=TRIP_END){ if(cityOn(d)) assigned++; d=addD(d,1); }
  const cities=[...new Set(state.items.filter(i=>i.type==='ciudad').map(i=>i.city))].length;
  const moves=state.items.filter(i=>i.type==='traslado').length;
  const acts=state.items.filter(i=>i.type==='actividad').length;
  document.getElementById('counter').innerHTML=[
    [assigned+'/'+TOTAL_DAYS,'Días con ciudad','hero-n'],[cities,'Ciudades'],[moves,'Traslados'],[acts,'Actividades']
  ].map(([n,l,c])=>`<div class="${c||''}"><span class="n">${n}</span><span class="l caps">${l}</span></div>`).join('');
  document.getElementById('heroDates').textContent='13 de septiembre → 3 de octubre · 19 noches · 4 viajeros';
}

function renderAlerts(){
  const A=[]; let sin=[],d=TRIP_START;
  while(d<=TRIP_END){ if(!cityOn(d)) sin.push(d); d=addD(d,1); }
  if(sin.length) A.push(['err',`<b>${sin.length} ${sin.length===1?'día sin ciudad':'días sin ciudad'}.</b> El primero es el ${fmt(sin[0])}.`]);
  const last=cityOn(TRIP_END);
  if(state.items.some(i=>i.type==='ciudad')){
    if(!last) A.push(['err','<b>El 2 de octubre no tiene ciudad.</b> El vuelo sale de Madrid a las 13:15 del 3.']);
    else if(!/madrid/i.test(last.city)) A.push(['err',`<b>El 2 de octubre amanecés en ${esc(last.city)}, no en Madrid.</b> El LA707 sale de Barajas el 3 a las 13:15.`]);
    else A.push(['ok','<b>Última noche en Madrid.</b> El regreso está cubierto.']);
  }
  d=addD(TRIP_START,1);
  while(d<=ACTIVE_END){
    const hoy=cityOn(d), ayer=cityOn(addD(d,-1));
    /* el traslado puede ir el mismo día o la víspera (vuelo o tren de noche) */
    const ayerD=addD(d,-1);
    if(hoy&&ayer&&hoy.city!==ayer.city && !state.items.some(x=>x.type==='traslado'&&(x.date===d||x.date===ayerD)))
      A.push(['',`<b>Falta el traslado del ${fmt(d)}:</b> ${esc(ayer.city)} → ${esc(hoy.city)}.`]);
    d=addD(d,1);
  }
  blocks().filter(b=>b.name&&b.days.length===1&&!/madrid/i.test(b.name)&&between(b.days[0],TRIP_START,TRIP_END))
    .forEach(b=>A.push(['',`<b>Un solo día en ${esc(b.name)}.</b> Entre llegar e irse no queda tiempo real.`]));
  document.getElementById('alerts').innerHTML=A.map(([c,t])=>`<div class="alert ${c}"><span class="dot"></span><div>${t}</div></div>`).join('');
}

/* ---- fichas ---- */
function chip(it,opts={}){
  const mv = it.locked?'':`<span class="mv">
      </span>`;
  const dg = (it.type==='actividad'&&it.res&&DETAIL[it.res])?`data-item="${it.id}" data-iid="${it.id}"`:'';
  const notes = opts.notes && it.notes ? `<small>${esc(it.notes)}</small>` : '';
  if(it.type==='traslado'){
    const sb=[MODEN[it.mode]||'',it.dep||'',it.dur?'· '+esc(it.dur):''].filter(Boolean).join(' ');
    return `<div class="chip ${it.mode==='avion'?'vuelo':'traslado'} ${it.locked?'locked':''}" ${dg}>
      <span class="tx"><b>${esc(it.from)} → ${esc(it.to)}</b><span>${sb}</span>${notes}</span>${mv}</div>`;
  }
  if(it.type==='actividad') return `<div class="chip ${it.res?'reservado':'actividad'}" ${dg}>
      <span class="tx"><b>${esc(it.name||'Actividad')}</b>${it.time?`<span>${it.time}</span>`:''}${it.res?`<em class="res">Reservado · ${esc(it.res)}${DETAIL[it.res]?' · ver ficha':''}</em>`:''}${notes}</span>${mv}</div>`;
  if(it.type==='hito') return `<div class="chip hito locked"><span class="tx"><b>${esc(it.name)}</b>${it.notes?`<small>${esc(it.notes)}</small>`:''}</span></div>`;
  return `<div class="chip nota" ${dg}><span class="tx"><b>${esc(it.name||it.notes||'Nota')}</b>${it.name&&it.notes?`<small>${esc(it.notes)}</small>`:''}</span>${mv}</div>`;
}

/* ---- agenda ---- */
function renderAgenda(){
  const bl=blocks(); let html=''; const seenPlaces=new Set();
  bl.forEach(b=>{
    if(b.name){
      const g=geo(b.name), ph=photos(b.name);
      const cls=ph.length===1?'one':ph.length===2?'two':'';
      const n=b.days.filter(x=>between(x,TRIP_START,TRIP_END)).length;
      const first=b.days[0], last=b.days[b.days.length-1];
      const rng= first===last? fmt(first) : `${s2d(first).getUTCDate()}–${fmt(last)}`;
      html+=`<section class="city">
        <div class="banner ${cls}">${ph.map(p=>`<div class="ph" style="background-image:url('${p}')"></div>`).join('')}
          <div class="cap"><div><h3>${esc(g?g.n:b.name)}</h3><div class="sub">${g?esc(g.c)+' · ':''}${rng}</div></div>
          <div class="n">${n} ${n===1?'día':'días'}</div></div></div>`;
    } else {
      html+=`<section class="city">`;
    }
    b.days.forEach(date=>{
      const its=itemsOn(date).filter(i=>i.type!=='ciudad');
      const c=cityOn(date);
      html+=`<div class="day ${its.length?'':'empty'}" data-day="${date}">
        <div class="dn"><span class="d">${s2d(date).getUTCDate()}</span><span class="w">${wd(date)}</span>${!b.name&&c?'':''}${c&&c.lodge?`<span class="c">${esc(c.lodge)}</span>`:''}</div>
        <div class="list">${its.map(i=>chip(i,{notes:true})).join('')}
          </div></div>`;
    });
    if(b.name){
      const k=slug(String(b.name).split(/[,/]| o | y /)[0]);
      const lst=PLACES[k];
      if(lst && !seenPlaces.has(k)){
        seenPlaces.add(k);
        html+=`<div class="places"><h4>Para conocer por su cuenta, sin tour</h4><ul>${lst.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
      }
    }
    html+=`</section>`;
  });
  document.getElementById('agenda').innerHTML=html;
  bind(document.getElementById('agenda'));
}

/* ---- calendario ---- */
function renderCal(){
  let html='',cur=GRID_START;
  while(cur<=GRID_END){
    html+='<tr>';
    for(let i=0;i<7;i++){
      const date=cur;
      if(!between(date,ACTIVE_START,ACTIVE_END)){ html+='<td class="off"></td>'; cur=addD(cur,1); continue; }
      let body='',dots='';
      itemsOn(date).forEach(it=>{
        if(it.type==='ciudad'){
          const prev=cityOn(addD(date,-1)); const cont=prev&&prev.city===it.city;
          body+=`<div class="band ${cont?'cont':''}"><span>${esc(it.city)}${it.lodge&&!cont?`<span class="lodge">${esc(it.lodge)}</span>`:''}</span></div>`;
        } else { body+=chip(it); dots+=`<i class="${it.type==='actividad'?'act':''}"></i>`; }
      });
      body+=dots?`<div class="mini">${dots}</div>`:'';
      html+=`<td class="${(date===TRIP_START||date===ACTIVE_END)?'key':''}" data-date="${date}">
        <div class="dnum"><span class="d">${s2d(date).getUTCDate()}</span><span class="wd">${wd(date)}</span></div>
        <div class="cellbody">${body}</div></td>`;
      cur=addD(cur,1);
    }
    html+='</tr>';
  }
  document.getElementById('calBody').innerHTML=html;
  bind(document.getElementById('calBody'));
}

function gotoDay(date){
  const btn=document.querySelector('nav.tabs button[data-view="vAgenda"]');
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on',x===btn));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='vAgenda'));
  const el=document.querySelector(`.day[data-day="${date}"]`);
  if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),60);
}
/* ---- ficha de actividad ---- */
function openSheet(it){
  const d=DETAIL[it.res]; if(!d) return false;
  const gal=d.ph.map((f,i)=>`<figure><img src="assets/actividades/${f}.jpg" alt="" loading="lazy">${d.cap&&d.cap[i]?`<figcaption>${esc(d.cap[i])}</figcaption>`:''}</figure>`).join('');
  const dots=d.ph.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('');
  const spec=(d.spec||[]).map(([k,v])=>`<div><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('');
  const li=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  document.getElementById('sheetBody').innerHTML=`
    <div class="sh-gal" id="shGal">${gal}</div>
    ${d.ph.length>1?`<div class="sh-dots" id="shDots">${dots}</div>`:''}
    <div class="sh-in">
      <h3>${esc(it.name)}</h3>
      <div class="sh-when">${wd(it.date)} ${s2d(it.date).getUTCDate()} de ${MESES[s2d(it.date).getUTCMonth()]}${it.time?' · '+it.time+' h':''}</div>
      <div class="sh-code">Reservado · ${esc(it.res)}</div>
      <p class="sh-lead">${esc(d.lead)}</p>
      ${(d.txt||[]).map(t=>`<p class="b">${esc(t)}</p>`).join('')}
      ${spec?`<div class="sh-h">Detalles</div><div class="sh-spec">${spec}</div>`:''}
      ${d.inc?`<div class="sh-h">Incluye</div><ul class="sh-list">${li(d.inc)}</ul>`:''}
      ${d.noinc?`<div class="sh-h">No incluye</div><ul class="sh-list">${li(d.noinc)}</ul>`:''}
      ${d.ojo?`<div class="sh-h">A tener en cuenta</div><ul class="sh-list warn">${li(d.ojo)}</ul>`:''}
      ${d.tip?`<div class="sh-h">Datos que vale la pena saber</div><ul class="sh-list tip">${li(d.tip)}</ul>`:''}
    </div>`;
  const sh=document.getElementById('sheet'); sh.showModal();
  document.getElementById('sheetBody').scrollTop=0;
  const g=document.getElementById('shGal'), dd=document.getElementById('shDots');
  if(g&&dd) g.onscroll=()=>{ const i=Math.round(g.scrollLeft/g.clientWidth);
    dd.querySelectorAll('i').forEach((x,j)=>x.classList.toggle('on',j===i)); };
  return true;
}
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
document.getElementById('sheetX').onclick=()=>document.getElementById('sheet').close();

function bind(root){
  root.querySelectorAll('td[data-date]').forEach(td=>td.addEventListener('click',e=>{
    if(window.innerWidth>=1100) return;
    e.stopPropagation(); e.preventDefault(); gotoDay(td.dataset.date);
  },true));

  root.querySelectorAll('[data-item]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const it=state.items.find(x=>x.id===b.dataset.item);
    if(it&&it.res) openSheet(it);
  });
}
function moveItem(id,nd){
  nd = nd<ACTIVE_START?ACTIVE_START:(nd>ACTIVE_END?ACTIVE_END:nd);
  const it=state.items.find(x=>x.id===id); if(!it||it.date===nd) return;
  if(it.type==='ciudad') state.items=state.items.filter(x=>!(x.type==='ciudad'&&x.date===nd));
  it.date=nd; save();
}

/* ---- resumen ---- */
function renderSummary(){
  const byCity={};
  state.items.filter(i=>i.type==='ciudad'&&between(i.date,TRIP_START,ACTIVE_END)).forEach(i=>{byCity[i.city]=(byCity[i.city]||0)+1;});
  const ents=Object.entries(byCity).sort((a,b)=>b[1]-a[1]);
  document.getElementById('sumCities').innerHTML=ents.length?ents.map(([c,n])=>
    `<div class="row"><span class="k"><b>${esc(c)}</b></span><span class="v">${n} ${n===1?'día':'días'}</span></div>`).join(''):'<p class="empty">Sin ciudades.</p>';
  const mv=state.items.filter(i=>i.type==='traslado').sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('sumMoves').innerHTML=mv.length?mv.map(m=>
    `<div class="row"><span class="k"><span class="mode">${MODEN[m.mode]||''}</span><b>${esc(m.from)}</b> → <b>${esc(m.to)}</b></span><span class="v">${fmt(m.date)}${m.dur?' · '+esc(m.dur):''}</span></div>`).join(''):'<p class="empty">Sin traslados.</p>';
}
function refreshCityList(){
  const dl=document.getElementById('cityList');
  dl.innerHTML=Object.values(GEO).map(g=>`<option value="${g.n}">`).join('');
}

/* ==================== MAPA ==================== */
let map=null, layer=null, poiLayer=null;
const slugGeo=n=>{ const k=slug(n); return POI[k]?k:(Object.keys(GEO).find(x=>GEO[x].n===n&&POI[x])||null); };
function renderMap(){
  if(typeof L==='undefined') return;
  if(!document.getElementById('vMapa').classList.contains('on')) return;   // solo si la pestaña está visible
  if(!map){
    map=L.map('map',{scrollWheelZoom:false,zoomControl:true,attributionControl:true});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
  }
  if(layer) layer.remove();
  if(poiLayer){ poiLayer.remove(); poiLayer=null; }
  layer=L.layerGroup().addTo(map);
  const bl=blocks().filter(b=>b.name&&geo(b.name));
  const pts=[];
  // líneas entre bloques consecutivos
  for(let i=1;i<bl.length;i++){
    const a=geo(bl[i-1].name), b=geo(bl[i].name);
    const day=bl[i].days[0];
    const tr=state.items.find(x=>x.type==='traslado'&&x.date===day);
    const air=tr?tr.mode==='avion':true;
    const line=L.polyline([a.ll,b.ll],{color:'#4969BC',weight:2,opacity:.9,dashArray:air?'6 7':null,lineCap:'round'}).addTo(layer);
    line.bindTooltip(`${a.n} → ${b.n}${tr?' · '+MODEN[tr.mode]+(tr.dur?' · '+tr.dur:''):''}`,{sticky:true});
  }
  // puntos
  const seen={};
  const wide=window.matchMedia('(min-width:760px)').matches;
  const byName={};
  bl.forEach((b,i)=>{ const g=geo(b.name); (byName[g.n]=byName[g.n]||{g,nums:[],days:[],lodge:b.lodge}).nums.push(i+1); byName[g.n].days.push(...b.days); });
  Object.values(byName).forEach(({g,nums,days,lodge})=>{
    pts.push(g.ll);
    const n=days.filter(x=>between(x,TRIP_START,TRIP_END)).length;
    const label=nums.join('·');
    const icon=L.divIcon({className:'',html:`<div class="num-pin ${label.length>2?'wide':''}">${label}</div>`,iconSize:[22,22],iconAnchor:[11,11]});
    const m=L.marker(g.ll,{icon}).addTo(layer);
    if(wide) m.bindTooltip(g.n,{permanent:true,direction:'right',offset:[12,0],className:'lbl'});
    m.bindPopup(`<b>${g.n}</b><br>${n} ${n===1?'día':'días'}${lodge?'<br>'+esc(lodge):''}`);
  });
  // excursiones de un día (actividades con nombre de ciudad conocida)
  state.items.filter(i=>i.type==='actividad').forEach(a=>{
    const first=String(a.name).split(/[,:]/)[0].trim(); const g=geo(first);
    if(!g) return; const base=cityOn(a.date); if(!base||slug(base.city)===slug(first)) return;
    const gb=geo(base.city); if(!gb) return;
    L.polyline([gb.ll,g.ll],{color:'#92A3D0',weight:1.5,opacity:.9,dashArray:'2 5'}).addTo(layer);
    L.circleMarker(g.ll,{radius:4,color:'#F3F1EC',weight:1.5,fillColor:'#92A3D0',fillOpacity:1}).addTo(layer)
      .bindTooltip(g.n,{direction:'right',offset:[6,0]}).bindPopup(`<b>${g.n}</b><br>Excursión del ${fmt(a.date)} desde ${gb.n}`);
    pts.push(g.ll);
  });
  // lugares turísticos de cada ciudad del viaje (aparecen al acercar el zoom)
  poiLayer=L.layerGroup();
  const keys=new Set();
  Object.values(byName).forEach(({g})=>{ const k=slugGeo(g.n); if(k) keys.add(k); });
  state.items.filter(i=>i.type==='actividad').forEach(a=>{
    const k=slug(String(a.name).split(/[,:]/)[0].trim()); if(POI[k]) keys.add(k);
    ['monreale','cefalu','pisa','pompeya','ravello','amalfi','agrigento','segesta','positano'].forEach(x=>{
      if(slug(String(a.name)).includes(x)) keys.add(x); });
  });
  keys.forEach(k=>(POI[k]||[]).forEach(([n,la,lo])=>{
    L.circleMarker([la,lo],{radius:4.5,color:'#F8F7F4',weight:2,fillColor:'#121212',fillOpacity:1})
      .addTo(poiLayer)
      .bindTooltip(n,{direction:'right',offset:[7,0],className:'poi-lbl'})
      .bindPopup(`<b>${esc(n)}</b>`);
  }));
  const syncPoi=()=>{
    const z=map.getZoom();
    if(z>=9){ if(!map.hasLayer(poiLayer)) poiLayer.addTo(map); } else if(map.hasLayer(poiLayer)) poiLayer.remove();
    const perm=z>=12;
    poiLayer.eachLayer(l=>{ const t=l.getTooltip(); if(t && t.options.permanent!==perm){ const c=t.getContent(); l.unbindTooltip(); l.bindTooltip(c,{permanent:perm,direction:'right',offset:[7,0],className:'poi-lbl'}); } });
  };
  map.off('zoomend',map._syncPoi); map._syncPoi=syncPoi; map.on('zoomend',syncPoi);

  map.invalidateSize();
  if(pts.length) map.fitBounds(L.latLngBounds(pts),{padding:[28,28],maxZoom:7}); else map.fitBounds([[36.5,-9.5],[46,18.5]]);
  syncPoi();
}

/* ==================== PORTADA: slideshow de ciudades del viaje ==================== */
function heroSlides(){
  const hero=$('hero'), dots=$('heroDots');
  const tag=$('heroTag');
  /* Portada: las ciudades del viaje, en orden */
  const HERO=[['roma',1],['palermo',1,'Sicilia'],['madrid',1],['toledo',1],['segovia',1],['napoles',1],['milan',1],['florencia',1]];
  const imgs=HERO.map(([k,i,alias])=>{ const g=GEO[k]; return {src:`assets/ciudades/${k}-${i}.jpg`,name:alias||g.n,country:g.c}; });
  hero.querySelectorAll('.slide').forEach(x=>x.remove()); dots.innerHTML='';
  const txt=hero.querySelector('.txt'); const sl=[], ds=[];
  imgs.forEach((im,i)=>{ const el=document.createElement('div'); el.className='slide'+(i?'':' on'); el.style.backgroundImage=`url('${im.src}')`; hero.insertBefore(el,txt); sl.push(el); const d=document.createElement('i'); if(!i) d.className='on'; dots.appendChild(d); ds.push(d); });
  const setTag=k=>{ tag.textContent=imgs[k].name+(imgs[k].country?' · '+imgs[k].country:''); };
  setTag(0);
  let i=0; if(window._heroT) clearInterval(window._heroT);
  if(imgs.length>1) window._heroT=setInterval(()=>{ sl[i].classList.remove('on'); ds[i].classList.remove('on'); i=(i+1)%sl.length; sl[i].classList.add('on'); ds[i].classList.add('on'); tag.style.opacity=0; setTimeout(()=>{setTag(i); tag.style.opacity=1;},800); },4200);
}
